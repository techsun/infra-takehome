apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: postgrest
  namespace: postgrest
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: postgrest
                port:
                  number: {{ .Values.service.port }}
